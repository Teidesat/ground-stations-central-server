name: ground-station-central-server

services:
  app:
    build: .
    image: ground-station-central-image
    container_name: ground-station-central-container
    command: /app/entrypoint.sh
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
  
  postgres:
    image: postgres:17-alpine
    container_name: my-postgres-container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: my-timescaledb-container
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: timescaledb
      POSTGRES_USER: timescale_user
      POSTGRES_PASSWORD: timescale_password
    restart: unless-stopped
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init-timescale.sql:/docker-entrypoint-initdb.d/01-init-timescale.sql

  redis:
    image: "redis:alpine"
    container_name: my-redis-container
    restart: unless-stopped
    ports: 
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery:
    image: ground-station-central-image
    container_name: my-celery-container
    command: celery -A main worker -E -l info
    volumes:
      - .:/app
    depends_on:
      - redis
      - app

  flower:
    image: ground-station-central-image
    container_name: my-flower-container
    command: celery -A main flower --basic_auth=admin:password123
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  postgres_data:
  timescaledb_data:
  redis_data: